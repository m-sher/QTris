<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QTris Rating Leaderboard</title>
    <style>
      :root {
        --bg: #0e1116;
        --panel: #171b22;
        --line: #262c36;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #f5a623;
        --good: #3fb950;
        --ref: #58a6ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        padding: 24px 16px 48px;
      }
      .wrap { max-width: 760px; margin: 0 auto; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
      .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
      .card {
        flex: 1 1 160px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
      .card .value { font-size: 22px; margin-top: 4px; }
      .delta-pos { color: var(--good); }
      .delta-neg { color: var(--accent); }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); }
      th:nth-child(2), td:nth-child(2) { text-align: left; }
      th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
      tr.learner td { background: rgba(245, 166, 35, .10); }
      tr.reference td { color: var(--ref); }
      .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
      .tag.live { color: var(--good); border-color: rgba(63,185,80,.4); }
      .name-tags { display: inline-flex; gap: 6px; align-items: center; }
      .rank { color: var(--muted); }
      .sigma { color: var(--muted); font-size: 12px; }
      .table-wrap { overflow-x: auto; }
      td.line { width: 190px; min-width: 150px; }
      /* Per-row uncertainty bar on a shared Elo axis (position = rating, bar
         length = 2 sigma). No axis ticks; the only mark is each row's own point. */
      .track { position: relative; display: block; height: 16px; }
      .track::before {
        content: ""; position: absolute; left: 0; right: 0; top: 50%;
        height: 1px; background: var(--line);
      }
      .rng { position: absolute; top: 50%; transform: translateY(-50%); height: 8px; border-radius: 4px; }
      .dot {
        position: absolute; top: 50%; transform: translate(-50%, -50%);
        width: 3px; height: 12px; border-radius: 2px; box-shadow: 0 0 0 1.5px var(--bg);
      }
      .b-learner { background: var(--accent); }
      .b-ref { background: var(--ref); }
      .b-pool { background: var(--muted); }
      .rng.b-learner { background: rgba(245, 166, 35, .35); }
      .rng.b-ref { background: rgba(88, 166, 255, .35); }
      .rng.b-pool { background: rgba(139, 148, 158, .28); }
      footer { color: var(--muted); font-size: 12px; margin-top: 18px; }
      a { color: var(--ref); }
      .status { color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>QTris Rating Leaderboard</h1>
      <div class="sub">1v1 AlphaZero opponent pool &middot; whole-history rating (gen_0 anchored at 1500)</div>

      <div id="cards" class="cards"></div>
      <div id="content"><p class="status">Loading&hellip;</p></div>

      <footer>
        Auto-refreshes every 30s &middot; <span id="updated">&mdash;</span><br />
        Ratings are whole-history (WHR) MAP estimates &plusmn;1&sigma;; gen_0 is the fixed anchor.
      </footer>
    </div>

    <script>
      const POLL_MS = 30000;

      function ago(iso) {
        if (!iso) return "no data yet";
        const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
        if (s < 60) return `updated ${Math.round(s)}s ago`;
        if (s < 3600) return `updated ${Math.round(s / 60)}m ago`;
        return `updated ${Math.round(s / 3600)}h ago`;
      }

      function card(label, value, deltaClass) {
        return `<div class="card"><div class="label">${label}</div><div class="value ${deltaClass || ""}">${value}</div></div>`;
      }

      function render(data) {
        const updated = document.getElementById("updated");
        const cards = document.getElementById("cards");
        const content = document.getElementById("content");

        if (!data || data.status === "waiting" || !Array.isArray(data.entries)) {
          cards.innerHTML = "";
          content.innerHTML = '<p class="status">Waiting for the first publish from the training run&hellip;</p>';
          updated.textContent = "no data yet";
          return;
        }

        // sigma may be absent from a payload.
        const sig = (e) =>
          e.sigma == null || e.is_reference ? "" : ` <span class="sigma">&plusmn;${Math.round(e.sigma)}</span>`;
        const genOf = (id) => (id.startsWith("gen_") ? Number(id.slice(4)) : Infinity);
        const entries = data.entries
          .slice()
          .sort((a, b) => b.rating - a.rating || genOf(b.id) - genOf(a.id));
        const learner = entries.find((e) => e.is_learner);
        const reference = entries.find((e) => e.is_reference);
        const pool = entries.filter((e) => !e.is_learner && !e.is_reference);
        const best = pool.length ? Math.max(...pool.map((e) => e.rating)) : null;

        // Shared Elo axis for the per-row bars: span every entry's rating ± sigma,
        // padded so the widest bar never touches the column edges. Missing sigma
        // and the reference (sigma 0) collapse to a bare point.
        const sigOf = (e) => (e.sigma == null ? 0 : e.sigma);
        let lo = Math.min(...entries.map((e) => e.rating - sigOf(e)));
        let hi = Math.max(...entries.map((e) => e.rating + sigOf(e)));
        const pad = Math.max((hi - lo) * 0.08, 5);
        lo -= pad;
        hi += pad;
        const span = Math.max(hi - lo, 1);
        const pct = (v) => ((v - lo) / span) * 100;
        const line = (e) => {
          const kind = e.is_learner ? "b-learner" : e.is_reference ? "b-ref" : "b-pool";
          const s = sigOf(e);
          const bar =
            s > 0
              ? `<span class="rng ${kind}" style="left:${pct(e.rating - s)}%;width:${(2 * s / span) * 100}%"></span>`
              : "";
          return `<span class="track">${bar}<span class="dot ${kind}" style="left:${pct(e.rating)}%"></span></span>`;
        };

        const lr = learner ? learner.rating : null;
        const lsig = learner && learner.sigma != null ? learner.sigma : null;
        const delta = lr != null && reference ? lr - reference.rating : null;
        // Color the delta only when it clears the learner's own sigma; inside
        // that band the posterior calls it a coin flip, so stay neutral.
        const deltaStr =
          delta == null
            ? "-"
            : (delta >= 0 ? "+" : "") + Math.round(delta) + (lsig != null ? ` ±${Math.round(lsig)}` : "");
        const deltaCls =
          delta == null || lsig == null
            ? ""
            : delta > lsig
              ? "delta-pos"
              : delta < -lsig
                ? "delta-neg"
                : "";
        cards.innerHTML =
          card("Learner", lr == null ? "-" : Math.round(lr) + (learner ? sig(learner) : "")) +
          card("vs reference", deltaStr, deltaCls) +
          card("Best pool", best == null ? "-" : Math.round(best));

        const rows = entries
          .map((e, i) => {
            const cls = e.is_learner ? "learner" : e.is_reference ? "reference" : "";
            const tags = [];
            if (e.is_reference) tags.push('<span class="tag">reference</span>');
            tags.push(`<span class="tag ${e.present ? "live" : ""}">${e.present ? "live" : "archived"}</span>`);
            return `<tr class="${cls}">
              <td class="rank">${i + 1}</td>
              <td><span class="name-tags">${e.id} ${tags.join(" ")}</span></td>
              <td>${Math.round(e.rating)}${sig(e)}</td>
              <td class="line">${line(e)}</td>
              <td>${e.games ?? 0}</td>
            </tr>`;
          })
          .join("");

        content.innerHTML = `<div class="table-wrap"><table>
          <thead><tr><th>#</th><th>Checkpoint</th><th>Rating</th><th>range</th><th>Games</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`;
        const genStr = data.gen != null ? `gen ${data.gen} · ` : "";
        updated.textContent = genStr + ago(data.updated_at);
      }

      async function tick() {
        try {
          const r = await fetch("/api/leaderboard", { cache: "no-store" });
          render(await r.json());
        } catch (e) {
          document.getElementById("updated").textContent = "fetch failed, retrying…";
        }
      }

      tick();
      setInterval(tick, POLL_MS);
    </script>
  </body>
</html>
